<svg width="400" height="400" viewBox="0 0 400 400" fill="none"
    xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="kiteGrad" x1="200" y1="50" x2="200" y2="300"
                gradientUnits="userSpaceOnUse">
                <stop stop-color="#3B82F6" />
                <stop offset="1" stop-color="#8B5CF6" />
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>
      
      <!-- Outer Kite Shape -->
      <path d="M200 40L320 180L200 320L80 180L200 40Z" fill="url(#kiteGrad)"
      fill-opacity="0.15" stroke="url(#kiteGrad)" stroke-width="4"
      stroke-linejoin="round" filter="url(#glow)" />
      
      <!-- Internal Connectivity Lines -->
      <path d="M200 40V320" stroke="url(#kiteGrad)" stroke-width="1"
      stroke-dasharray="4 4" />
      <path d="M80 180H320" stroke="url(#kiteGrad)" stroke-width="1"
      stroke-dasharray="4 4" />
      
      <!-- Central AI Node -->
      <rect x="180" y="160" width="40" height="40" rx="8" fill="#3B82F6" />
      <circle cx="200" cy="180" r="8" fill="white" filter="url(#glow)" />
      
      <!-- Tail / Data Stream -->
      <path d="M200 320C200 320 220 350 200 380C180 350 200 320 200 320Z"
      fill="url(#kiteGrad)" />
      <circle cx="200" cy="350" r="3" fill="#8B5CF6" />
      <circle cx="200" cy="385" r="2" fill="#3B82F6" opacity="0.5" />
</svg>
